name: Documentation
description: Report missing, incorrect, or unclear documentation
labels: ["documentation"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs improving?
      description: Describe the documentation issue clearly.
      placeholder: The setup guide is missing the step to configure the database URL.
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Where is the documentation? Link or file path.
      placeholder: docs/architecture.md or README.md

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Missing documentation
        - Incorrect documentation
        - Unclear documentation
        - Outdated documentation
        - Typo or grammar
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Fix
      description: If you have a suggested fix, describe it here.
