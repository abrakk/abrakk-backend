version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: edukit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edukit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edukit_password}
      POSTGRES_DB: ${POSTGRES_DB:-edukit_development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edukit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: edukit_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-edukit}:${POSTGRES_PASSWORD:-edukit_password}@db:5432/${POSTGRES_DB:-edukit_development}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      RUST_LOG: ${RUST_LOG:-info}
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: edukit_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
